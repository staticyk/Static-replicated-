<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Tab</title>
  <style>
    body {
      background-color: #080b10;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 24px;
      color: #38bdf8;
    }
    .search-box {
      width: 80%;
      max-width: 600px;
      padding: 14px 20px;
      border-radius: 24px;
      border: 1px solid #1e293b;
      background-color: #0f141c;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    .search-box:focus {
      border-color: #2563eb;
    }
  </style>
</head>
<body>
  <h1>Static</h1>
  <input type="text" class="search-box" placeholder="Search or type a URL..." onkeydown="if(event.key==='Enter') parent.postMessage({type:'NAVIGATE', url: this.value}, '*')" />
</body>
</html>
