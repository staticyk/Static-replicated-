<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static</title>
  <link rel="stylesheet" href="style.css">
    <script src="/scramjet/scramjet.js"></script>
    <script src="/controller/controller.api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/dist/index.js"></script>
</head>
<body>
  <header class="browser-header">
    <div class="tab-strip" id="tab-strip">
      <button class="new-tab-btn" id="new-tab-btn" title="New Tab">+</button>
    </div>
    <div class="nav-bar">
      <button class="nav-btn" id="btn-back" title="Back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <button class="nav-btn" id="btn-forward" title="Forward">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
      <button class="nav-btn" id="btn-reload" title="Reload">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button class="nav-btn" id="btn-home" title="Home">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>

      <div class="address-bar-container">
        <span class="address-icon">🔒</span>
        <input type="text" id="address-input" class="address-input" placeholder="Search Google or enter URL" spellcheck="false" autocomplete="off" />
      </div>
    </div>
  </header>

  <main class="viewport" id="viewport-container"></main>

  <!-- Scramjet Integration Controller Scripts -->
  <script src="../scramjet/scramjet.codecs.js"></script>
  <script src="../scramjet/scramjet.config.js"></script>
  <script src="../scramjet/scramjet.controller.js"></script>

  <script>
    window.scramjetReady = false;
    window.scramjetCtrl = null;
    
    async function initScramjet() {
      try {
        if ("serviceWorker" in navigator) {
          await navigator.serviceWorker.register("/sw.js");
          await navigator.serviceWorker.ready;
          if (typeof self.EpoxyTransport !== 'undefined' && typeof $scramjetController !== 'undefined') {
            const sw = navigator.serviceWorker.controller || (await navigator.serviceWorker.ready).active;
            const transport = new self.EpoxyTransport.default({ wisp: "wss://wisp.mercurywork.shop/" });
            await transport.init();
            window.scramjetCtrl = new $scramjetController.Controller({ serviceworker: sw, transport, scramjetConfig: $scramjet.defaultConfig });
            await window.scramjetCtrl.wait();
            window.scramjetReady = true;
          }
        }
      } catch(e) {
        console.error("Scramjet controller init bypassed:", e);
      }
    }
    initScramjet();
  </script>

  <script src="script.js"></script>
</body>
</html>
